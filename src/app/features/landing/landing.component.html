<section class="landing">
  <div class="row g-3 mb-3" *ngIf="cards().length">
    <div [class]="card.col" *ngFor="let card of cards()">
      <mat-card class="role-card role-card--{{ card.accent }}" appearance="outlined">
        <div class="role-card__icon">
          <mat-icon>{{ card.icon }}</mat-icon>
        </div>
        <mat-card-title class="role-card__title">{{ card.title }}</mat-card-title>
        <p class="role-card__subtitle">{{ card.subtitle }}</p>
        <mat-card-content class="role-card__description">{{ card.description }}</mat-card-content>
        <mat-card-actions class="role-card__actions">
          <a mat-flat-button class="role-card__cta" [routerLink]="card.route">
            Enter <mat-icon iconPositionEnd>arrow_forward</mat-icon>
          </a>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <mat-card
    class="community-card community-card--{{ community()?.accent }}"
    appearance="outlined"
    *ngIf="community() as c"
  >
    <div class="community-card__info">
      <div class="community-card__icon">
        <mat-icon>{{ c.icon }}</mat-icon>
      </div>
      <div>
        <h3 class="community-card__title">{{ c.title }}</h3>
        <p class="community-card__subtitle">{{ c.subtitle }}</p>
      </div>
    </div>
    <p class="community-card__description">{{ c.description }}</p>
    <div class="community-card__actions">
      <button mat-stroked-button class="community-card__browse" disabled>
        <mat-icon>list</mat-icon> {{ c.browseLabel }}
      </button>
      <a mat-flat-button class="community-card__signin" [routerLink]="c.route">
        {{ c.btnLabel }} <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </a>
    </div>
  </mat-card>
</section>
