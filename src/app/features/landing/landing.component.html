<section class="landing container">
  @if (cards().length) {
    <div class="row g-3 mb-3">
      @for (card of cards(); track card.title) {
        <div [class]="card.col">
          <mat-card class="role-card role-card--{{ card.accent }}" appearance="outlined">
            <mat-card-header>
              <div mat-card-avatar class="role-card__icon">
                <mat-icon>{{ card.icon }}</mat-icon>
              </div>
              <mat-card-title class="role-card__title">{{ card.title }}</mat-card-title>
              <mat-card-subtitle class="role-card__subtitle">{{ card.subtitle }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content class="role-card__description">{{ card.description }}</mat-card-content>
            <mat-card-actions class="role-card__actions">
              @if (card.link) {
                <a mat-flat-button class="role-card__cta" [href]="card.link">
                  {{ card.btnLabel || 'Enter' }} <mat-icon iconPositionEnd>arrow_forward</mat-icon>
                </a>
              } @else {
                <a mat-flat-button class="role-card__cta" [routerLink]="card.route">
                  {{ card.btnLabel || 'Enter' }} <mat-icon iconPositionEnd>arrow_forward</mat-icon>
                </a>
              }
            </mat-card-actions>
          </mat-card>
        </div>
      }
    </div>
  }
</section>
