<div class="exemption-notice border d-flex align-items-start gap-3">
  <span
    class="exemption-notice-icon-ring d-inline-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
  >
    <i class="bi bi-shield-check" aria-hidden="true"></i>
  </span>
  <div>
    <p class="exemption-notice-title fw-semibold mb-1">{{ title() }}</p>
    <p class="exemption-notice-message text-secondary mb-0">
      <span class="fw-semibold">{{ greeting() }}</span> {{ message() }}
    </p>
  </div>
</div>
