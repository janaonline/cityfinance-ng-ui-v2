<section class="xvifc-theme cs-page d-flex align-items-center justify-content-center py-5 px-3">
  <div class="cs-card" style="max-width: 640px">
    <span class="cs-deco cs-deco--1" aria-hidden="true"></span>
    <span class="cs-deco cs-deco--2" aria-hidden="true"></span>

    <div class="cs-body text-center">
      <span class="cs-tag">16th Finance Commission</span>

      <h1 class="cs-title mb-3">Welcome to the Grants Portal</h1>
      <p class="cs-desc mb-4">
        Thanks for verifying your profile. Forms for your ULB will be available here soon — we'll notify you as soon
        as they're ready.
        <br />
        No action is needed from you in the meantime.
      </p>

      <button class="cs-btn" type="button" (click)="logout()">
        <i class="bi bi-box-arrow-right cs-btn__icon" aria-hidden="true"></i>
        <span>Log out</span>
      </button>
    </div>
  </div>
</section>
