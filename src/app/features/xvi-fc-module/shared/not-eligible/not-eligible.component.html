<section class="xvifc-theme d-flex align-items-center justify-content-center py-5">
  <div class="container text-center" style="max-width: 720px">
    <div class="not-eligible-icon-ring d-inline-flex align-items-center justify-content-center rounded-circle p-4 mb-3">
      <span class="material-icons fs-1">block</span>
    </div>

    <h2 class="fw-bold mb-3">Not Eligible</h2>
    <p class="text-secondary mb-4">
      Under the 16th Finance Commission, Cantonment Boards are no longer eligible for grants. As a result, no further
      submissions or grant-related actions are required from you on City Finance.
      <br />
      For any questions regarding your eligibility, please contact your State DMA.
    </p>

    <button mat-flat-button color="primary" type="button" class="px-5" (click)="logout()">Log out</button>
  </div>
</section>
