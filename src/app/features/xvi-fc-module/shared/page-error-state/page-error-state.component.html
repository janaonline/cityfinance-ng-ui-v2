<div class="error-state-wrap">
  <div class="error-state-card">
    <div class="error-icon-ring">
      <mat-icon class="error-icon">cloud_off</mat-icon>
    </div>

    <h2 class="error-title">{{ title }}</h2>
    <p class="error-message">{{ message }}</p>

    @if (showRetry) {
      <button mat-stroked-button class="retry-btn" type="button" (click)="retry.emit()">
        <mat-icon>refresh</mat-icon>
        {{ retryLabel }}
      </button>
    }
  </div>
</div>
