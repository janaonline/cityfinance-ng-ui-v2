<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="text-secondary small mb-2">{{ data.description }}</p>

  @if (formError()) {
    <div class="alert alert-danger py-2 px-3 small mb-2" role="alert">{{ formError() }}</div>
  }

  <label class="form-label small fw-semibold" for="mohua-remarks-textarea">Remarks</label>
  <textarea
    id="mohua-remarks-textarea"
    class="form-control"
    [class.is-invalid]="showRequiredError || remarks.errors?.['apiError']"
    rows="4"
    [formControl]="remarks"
    [disabled]="isSubmitting()"
  ></textarea>
  @if (showRequiredError) {
    <div class="invalid-feedback d-block">Remarks are required.</div>
  } @else if (remarks.errors?.['apiError']) {
    <div class="invalid-feedback d-block">{{ remarks.errors?.['apiError'] }}</div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [disabled]="isSubmitting()" (click)="cancel()">Cancel</button>
  <button matButton="filled" type="button" [disabled]="isSubmitting()" (click)="submit()">
    @if (isSubmitting()) {
      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
    }
    {{ data.submitLabel }}
  </button>
</mat-dialog-actions>
