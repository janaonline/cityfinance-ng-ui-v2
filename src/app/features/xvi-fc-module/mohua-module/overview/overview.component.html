<div class="ov-page">
  <header class="ov-header">
    <h1 class="ov-title">Overview</h1>
    @if (yearLabel()) {
      <span class="ov-year">{{ yearLabel() }}</span>
    }
    <p class="ov-subtitle">XVI Finance Commission &mdash; {{ organisationName }}</p>
  </header>

  @if (overview(); as data) {
    <app-ov-briefing
      [rows]="rows()"
      [totals]="data.totals"
      [claims]="claims()?.overview ?? null"
      (statusPick)="showStatus($event)"
    />
    <app-ov-states-glance #states [rows]="rows()" [claims]="claims()?.states ?? null" [(filter)]="stateFilter" />
  } @else if (loading()) {
    <app-mohua-page-loader label="Loading the overview" />
  } @else {
    <div class="ov-message" role="alert">
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="load()">Try again</button>
    </div>
  }
</div>
