<div class="ov-page">
  <header class="ov-header">
    <h1 class="ov-title">Overview</h1>
    @if (yearLabel()) {
      <span class="ov-year">{{ yearLabel() }}</span>
    }
    <p class="ov-subtitle">XVI Finance Commission &mdash; Ministry of Housing and Urban Affairs</p>
  </header>

  <app-ov-briefing [rows]="rows" (statusPick)="showStatus($event)" />
  <app-ov-states-glance #states [rows]="rows" [(filter)]="stateFilter" />
</div>
