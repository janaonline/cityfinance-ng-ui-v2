<div class="ov-page">
  <header class="ov-header">
    <h1 class="ov-title">Overview</h1>
    @if (yearLabel()) {
      <span class="ov-year">{{ yearLabel() }}</span>
    }
    <p class="ov-subtitle">XVI Finance Commission &mdash; Ministry of Housing and Urban Affairs</p>
  </header>

  @if (overview(); as data) {
    <app-ov-briefing [rows]="rows()" [totals]="data.totals" (statusPick)="showStatus($event)" />
    <app-ov-states-glance #states [rows]="rows()" [(filter)]="stateFilter" />
  } @else if (loading()) {
    <p class="ov-message" role="status">Loading the overview…</p>
  } @else {
    <div class="ov-message" role="alert">
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="load()">Try again</button>
    </div>
  }
</div>
