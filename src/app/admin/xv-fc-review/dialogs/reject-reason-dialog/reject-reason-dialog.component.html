<h2 mat-dialog-title>Reject {{ data.code }}</h2>

<mat-dialog-content>
  <div class="row-label bg-light border rounded px-3 py-2 mb-3 text-muted small">
    {{ data.code }} - {{ data.label }}
  </div>
  <p class="small text-muted mb-2">Provide a mandatory reason for rejecting this correction. It will be visible to the ULB.</p>
  <label class="fw-bold small d-block mb-2" for="reject-reason">Rejection Reason <span class="text-danger">*</span></label>
  <textarea
    id="reject-reason"
    class="reject-reason-field"
    rows="4"
    [formControl]="reason"
    placeholder="e.g. Corrected value does not match supporting document / audited figures..."
  ></textarea>
  @if (reason.touched && reason.invalid) {
    <div class="text-danger small mt-1">Rejection reason is mandatory.</div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-outline-custom" type="button" (click)="cancel()">Cancel</button>
  <button class="btn-primary-custom" type="button" style="background: var(--red)" (click)="confirm()">
    Confirm Rejection
  </button>
</mat-dialog-actions>
